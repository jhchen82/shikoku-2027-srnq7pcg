<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>🔒 2027 家族旅行專屬行程表</title>
  <style id="lock-style">
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      max-width: 100%;
      overflow-x: clip;
      background: #F7F4EC;
      color: #1F2937;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .lock-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top right, rgba(184, 134, 45, 0.14), transparent 55%), #F7F4EC;
    }
    .lock-card {
      width: 100%;
      max-width: 410px;
      background: #FFFFFF;
      border: 1px solid #DFD5C3;
      border-radius: 16px;
      box-shadow: 0 18px 42px rgba(30, 58, 95, 0.12);
      overflow: hidden;
    }
    .lock-head {
      background: linear-gradient(135deg, #1E3A5F 0%, #274C77 100%);
      color: #FFFFFF;
      padding: 22px 24px 18px;
      border-bottom: 3px solid #C59B43;
    }
    .lock-badge {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(243, 217, 153, 0.2);
      color: #F3D999;
      margin-bottom: 8px;
    }
    .lock-head h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.35;
    }
    .lock-head p {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
    }
    .lock-body {
      padding: 22px 24px 24px;
    }
    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #1E3A5F;
      margin-bottom: 8px;
    }
    .pin-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .pin-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 18px;
      letter-spacing: 0.16em;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      background: #F8FAFC;
      color: #0F172A;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .pin-input::placeholder {
      font-size: 14px;
      letter-spacing: normal;
      color: #94A3B8;
    }
    .pin-input:focus {
      border-color: #1E3A5F;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.14);
    }
    .vis-btn {
      padding: 0 12px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      background: #FFFFFF;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .vis-btn:hover { background: #F1F5F9; }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 13.5px;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }
    .remember-row input {
      width: 17px;
      height: 17px;
      accent-color: #1E3A5F;
      cursor: pointer;
      flex-shrink: 0;
    }
    .unlock-btn {
      width: 100%;
      margin-top: 16px;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      background: #1E3A5F;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease;
    }
    .unlock-btn:hover { background: #162D4A; }
    .unlock-btn:disabled { opacity: 0.65; cursor: wait; }
    .lock-msg {
      margin-top: 12px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      color: #B83B2A;
    }
    .lock-msg.info { color: #1E3A5F; }
    .lock-foot {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #EFEAE0;
      font-size: 11.5px;
      color: #64748B;
      line-height: 1.55;
    }
    @media (max-width: 480px) {
      .lock-wrap { padding: 14px; }
      .lock-head { padding: 18px 18px 15px; }
      .lock-head h1 { font-size: 18.5px; }
      .lock-body { padding: 18px 18px 20px; }
      .pin-input { padding: 11px 12px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="lock-wrap" id="lock-screen">
    <div class="lock-card">
      <div class="lock-head">
        <span class="lock-badge">AES-256-GCM FAMILY LOCK</span>
        <h1>🔒 2027 家族旅行專屬行程表</h1>
        <p>頁面已全程加密，僅供家人檢視（含 11日／8日版本、路線地圖與 55 張實景參考圖）</p>
      </div>
      <form class="lock-body" id="unlock-form" autocomplete="off">
        <label class="field-label" for="pin-input">家庭通關密碼</label>
        <div class="pin-row">
          <input id="pin-input" class="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="請輸入 4 位數家庭密碼" required />
          <button type="button" class="vis-btn" id="toggle-vis">顯示</button>
        </div>
        <label class="remember-row">
          <input type="checkbox" id="remember-chk" checked />
          <span>此裝置記住解鎖狀態（下次免重打）</span>
        </label>
        <button type="submit" class="unlock-btn" id="unlock-btn">解鎖檢視行程</button>
        <div class="lock-msg" id="lock-msg" aria-live="polite"></div>
        <div class="lock-foot">
          加密方式：PBKDF2-SHA256 (600,000 次) + AES-256-GCM 瀏覽器端即時解密；密碼不會上傳至伺服器。
        </div>
      </form>
    </div>
  </div>

      var KEY_STORE = 's27_aes_key_v1';

      var form = document.getElementById('unlock-form');
      var pinEl = document.getElementById('pin-input');
      var visBtn = document.getElementById('toggle-vis');
      var remEl = document.getElementById('remember-chk');
      var btnEl = document.getElementById('unlock-btn');
      var msgEl = document.getElementById('lock-msg');

      function setMsg(text, isInfo) {
        if (!msgEl) return;
        msgEl.textContent = text || '';
        msgEl.className = isInfo ? 'lock-msg info' : 'lock-msg';
      }

      function safeGet(store, k) {
        try { return store ? store.getItem(k) : null; } catch (e) { return null; }
      }
      function safeSet(store, k, v) {
        try { if (store) store.setItem(k, v); } catch (e) {}
      }
      function safeDel(store, k) {
        try { if (store) store.removeItem(k); } catch (e) {}
      }

      function b64ToBytes(b64) {
        var bin = atob(b64);
        var len = bin.length;
        var out = new Uint8Array(len);
        for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      function bytesToB64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      async function decryptWithKey(aesKey) {
        var plainBuf = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToBytes(IV_B64) },
          aesKey,
          b64ToBytes(PAYLOAD_B64)
        );
        return new TextDecoder().decode(plainBuf);
      }

      function injectLockButton() {
        function doLock() {
          safeDel(window.localStorage, KEY_STORE);
          safeDel(window.sessionStorage, KEY_STORE);
          window.location.reload();
        }
        var ag = document.querySelector('.action-group');
        if (ag) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn-action';
          b.id = 'relock-btn';
          b.textContent = '🔒 上鎖';
          b.addEventListener('click', doLock);
          ag.appendChild(b);
          return;
        }
        var ip = document.querySelector('.info-panel');
        if (ip) {
          var row = ip.querySelector('div') || ip;
          var mb = document.createElement('button');
          mb.type = 'button';
          mb.id = 'relock-btn';
          mb.textContent = '🔒 上鎖';
          mb.style.cssText = 'display:inline-block;padding:5px 10px;background:#fff;color:#B83B2A;border:1px solid #B83B2A;border-radius:6px;font-size:12.5px;font-weight:bold;cursor:pointer;';
          mb.addEventListener('click', doLock);
          row.appendChild(mb);
        }
      }

      async function mountDecryptedHtml(htmlText) {
        var parsed = new DOMParser().parseFromString(htmlText, 'text/html');
        document.title = parsed.title || '2027 四國行程表';

        var allScripts = [];
        function harvestScripts(root) {
          if (!root) return;
          var list = root.querySelectorAll('script');
          for (var i = 0; i < list.length; i++) {
            var s = list[i];
            allScripts.push({
              src: s.getAttribute('src'),
              text: s.textContent || ''
            });
          }
          for (var j = list.length - 1; j >= 0; j--) {
            if (list[j].parentNode) list[j].parentNode.removeChild(list[j]);
          }
        }
        harvestScripts(parsed.head);
        harvestScripts(parsed.body);

        var lockStyle = document.getElementById('lock-style');
        if (lockStyle && lockStyle.parentNode) lockStyle.parentNode.removeChild(lockStyle);

        var styleWait = [];
        var headNodes = parsed.head ? parsed.head.querySelectorAll('style, link[rel="stylesheet"]') : [];
        for (var k = 0; k < headNodes.length; k++) {
          var node = headNodes[k];
          if (node.tagName === 'LINK') {
            var lnk = document.createElement('link');
            lnk.rel = 'stylesheet';
            var href = node.getAttribute('href');
            if (href) lnk.href = href;
            styleWait.push(new Promise(function (resolve) {
              lnk.onload = resolve;
              lnk.onerror = resolve;
            }));
            document.head.appendChild(lnk);
          } else {
            var st = document.createElement('style');
            st.textContent = node.textContent || '';
            document.head.appendChild(st);
          }
        }

        if (styleWait.length) {
          await Promise.race([
            Promise.all(styleWait),
            new Promise(function (r) { setTimeout(r, 2500); })
          ]);
        }

        document.body.removeAttribute('style');
        document.body.className = (parsed.body && parsed.body.className) ? parsed.body.className : '';
        document.body.innerHTML = parsed.body ? parsed.body.innerHTML : '';

        injectLockButton();

        for (var m = 0; m < allScripts.length; m++) {
          var item = allScripts[m];
          var el = document.createElement('script');
          if (item.src) {
            await new Promise(function (resolve) {
              el.src = item.src;
              el.onload = resolve;
              el.onerror = resolve;
              document.body.appendChild(el);
            });
          } else {
            el.textContent = item.text;
            document.body.appendChild(el);
          }
        }

        setTimeout(function () {
          try { window.dispatchEvent(new Event('resize')); } catch (e) {}
          if (window.location.hash) {
            var target = document.getElementById(window.location.hash.slice(1));
            if (target && typeof target.scrollIntoView === 'function') {
              target.scrollIntoView();
            }
          }
        }, 120);
      }

      if (visBtn && pinEl) {
        visBtn.addEventListener('click', function () {
          var isPwd = pinEl.type === 'password';
          pinEl.type = isPwd ? 'text' : 'password';
          visBtn.textContent = isPwd ? '隱藏' : '顯示';
        });
      }

      if (!window.crypto || !window.crypto.subtle) {
        if (btnEl) btnEl.disabled = true;
        setMsg('此環境不支援瀏覽器加密解密（WebCrypto），請透過 GitHub Pages (HTTPS) 或 localhost 開啟。', false);
        return;
      }

      async function tryAutoUnlock() {
        var saved = safeGet(window.sessionStorage, KEY_STORE) || safeGet(window.localStorage, KEY_STORE);
        if (!saved) return;
        try {
          setMsg('偵測到已記住的裝置金鑰，正在自動解鎖…', true);
          var rawBytes = b64ToBytes(saved);
          var aesKey = await window.crypto.subtle.importKey('raw', rawBytes, { name: 'AES-GCM' }, false, ['decrypt']);
          var htmlText = await decryptWithKey(aesKey);
          safeSet(window.sessionStorage, KEY_STORE, saved);
          await mountDecryptedHtml(htmlText);
        } catch (err) {
          safeDel(window.sessionStorage, KEY_STORE);
          safeDel(window.localStorage, KEY_STORE);
          setMsg('', false);
        }
      }

      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          var pin = (pinEl.value || '').replace(/\s+/g, '');
          if (!pin) {
            setMsg('請先輸入家庭通關密碼。', false);
            return;
          }
          btnEl.disabled = true;
          setMsg('正在驗證密碼與解密行程中…', true);

          var htmlText = null;
          var keyB64 = null;
          try {
            var baseKey = await window.crypto.subtle.importKey(
              'raw',
              new TextEncoder().encode(pin),
              'PBKDF2',
              false,
              ['deriveBits']
            );
            var keyBits = await window.crypto.subtle.deriveBits(
              { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: 600000, hash: 'SHA-256' },
              baseKey,
              256
            );
            var aesKey = await window.crypto.subtle.importKey('raw', keyBits, { name: 'AES-GCM' }, false, ['decrypt']);
            htmlText = await decryptWithKey(aesKey);
            keyB64 = bytesToB64(new Uint8Array(keyBits));
          } catch (cryptErr) {
            btnEl.disabled = false;
            setMsg('密碼錯誤，請確認後再試。', false);
            pinEl.focus();
            pinEl.select();
            return;
          }

          safeSet(window.sessionStorage, KEY_STORE, keyB64);
          if (remEl && remEl.checked) {
            safeSet(window.localStorage, KEY_STORE, keyB64);
          } else {
            safeDel(window.localStorage, KEY_STORE);
          }

          try {
            await mountDecryptedHtml(htmlText);
          } catch (mountErr) {
            btnEl.disabled = false;
            setMsg('頁面載入發生異常：' + (mountErr && mountErr.message ? mountErr.message : '請重新整理頁面'), false);
          }
        });
      }

      tryAutoUnlock();
    })();
  </script>
